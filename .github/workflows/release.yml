name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: darwin-amd64
            os: macos-26-intel
          - name: darwin-arm64
            os: macos-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC=musl-gcc" >> "$GITHUB_ENV"

      - name: Build binary
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Static musl build for maximum cross-distro compatibility.
            go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${version} -linkmode external -extldflags '-static'" \
              -o dist/age-plugin-1pass .
          else
            go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o dist/age-plugin-1pass .
          fi

      - name: Package archive
        run: |
          archive_base="age-plugin-1pass-${GITHUB_REF_NAME}-${{ matrix.name }}"
          cd dist
          tar -czf "${archive_base}.tar.gz" age-plugin-1pass
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive_base}.tar.gz" > "${archive_base}.tar.gz.sha256"
          else
            shasum -a 256 "${archive_base}.tar.gz" > "${archive_base}.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: age-plugin-1pass-${{ matrix.name }}
          path: |
            dist/age-plugin-1pass-*.tar.gz
            dist/age-plugin-1pass-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  nix:
    name: Nix build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: darwin-amd64
            os: macos-26-intel
          - name: darwin-arm64
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Set up Cachix (thomastaylor312)
        # Watches the Nix store during the job and pushes any newly built
        # paths to https://thomastaylor312.cachix.org. CACHIX_AUTH_TOKEN is
        # required in repository secrets for pushes to succeed; without it
        # the job still builds but acts as a read-only consumer.
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: thomastaylor312
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Nix flake check
        # Runs the Go tests (via buildGoModule's check phase) and evaluates
        # every flake output for this system.
        run: nix flake check --print-build-logs

      - name: Nix build
        run: nix build --print-build-logs .#age-plugin-1pass

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            dist/age-plugin-1pass-*.tar.gz
            dist/age-plugin-1pass-*.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
