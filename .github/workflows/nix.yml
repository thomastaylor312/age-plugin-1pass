name: Nix

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Nix build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: darwin-amd64
            os: macos-26-intel
          - name: darwin-arm64
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Set up Cachix (thomastaylor312)
        # Read-through cache. On pull_request from forks the auth token is
        # unavailable so the action silently falls back to pull-only mode,
        # which is fine — we still benefit from the existing cache.
        uses: cachix/cachix-action@f495f3ffa2f3810a92e5cc0abc2c5d6a2a07ec82 # v17
        with:
          name: thomastaylor312
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Nix flake check
        # Builds the package (darwin) or the pkgsStatic musl variant (linux)
        # and runs `go test ./...` via buildGoModule's check phase.
        run: nix flake check --print-build-logs

      - name: Nix build
        run: nix build --print-build-logs .#age-plugin-1pass
