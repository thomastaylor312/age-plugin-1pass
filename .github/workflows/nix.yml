name: Nix

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Nix build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: darwin-amd64
            os: macos-26-intel
          - name: darwin-arm64
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f # v31.10.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Set up Cachix (thomastaylor312)
        # Read-through cache. On pull_request from forks the auth token is
        # unavailable so the action silently falls back to pull-only mode,
        # which is fine — we still benefit from the existing cache.
        uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: thomastaylor312
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Nix flake check
        # Builds the package (darwin) or the pkgsStatic musl variant (linux)
        # and runs `go test ./...` via buildGoModule's check phase.
        run: nix flake check --print-build-logs

      - name: Nix build
        run: nix build --print-build-logs .#age-plugin-1pass
